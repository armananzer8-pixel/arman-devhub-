{% extends "homepage/base.html" %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<h1>Forgot Your Password?</h1>

<div class="card">

    <h2>Reset Your Password</h2>

    <p>
        Enter your registered email address
        to request a password reset link.
    </p>

    <form method="POST" class="contact-form">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <p>
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </p>

</div>

{% endblock %}
