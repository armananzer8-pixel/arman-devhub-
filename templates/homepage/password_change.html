{% extends "homepage/base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<h1>Change Your Password</h1>

<div class="card">

    <h2>Account Security</h2>

    <form method="POST" class="contact-form">

        {% csrf_token %}

        {% if form.errors %}
            <p style="color: red;">
                Please correct the errors below.
            </p>
        {% endif %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

    <p>
        <a href="{% url 'profile' %}">
            Back to My Profile
        </a>
    </p>

</div>

{% endblock %}
