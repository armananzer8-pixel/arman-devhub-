<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>500 - Server Error</title>

    <style>

        body {
            background-color: #bbf7d0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            margin: 60px auto;
        }

        h1 {
            font-size: 70px;
            color: #dc2626;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            background-color: #4338ca;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>500</h1>

        <h2>Something Went Wrong</h2>

        <p>
            Our server encountered an unexpected problem.
        </p>

        <p>
            Please try again later.
        </p>

        <a href="/">
            Back to Home
        </a>

    </div>

</body>

</html>
